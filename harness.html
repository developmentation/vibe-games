<script>
const harnessData = {
  meta: {
    title: "Claude Build Harness",
    tagline: "The 8-phase build lifecycle + build framework, fully integrated for Claude Code.",
    description: "This harness is a reusable Claude Code workspace designed to run unchanged across many projects. It is opinionated about the technology stack (Vue 3 frontend + Node.js / Express backend as first-class, Go / Chi as a second-class option) but generic about the project. Nothing in the skills, gates, or template is specific to any particular module; every check derives its facts at runtime from requirements.md / router / migrations / scan output. Open it in Claude Code and every skill, hook, guide, standard, and template loads automatically. It bundles an 8-phase local-file lifecycle (phase1-requirements → phase8-deployment), a production-tested template, sequential build guides, cross-cutting standards, and four review frameworks (blueteam defensive, redteam offensive, greenteam code review, yellowteam AI-smell prose).",
    audience: [
      { who: "Layperson", why: "Skim the flowchart and skill cards to understand what the system does and why it has 8 phases." },
      { who: "AI expert", why: "Drill into the methodology refs and validation framework to evaluate rigor and adapt the patterns." },
      { who: "Claude itself", why: "The harnessData JSON above and the semantic HTML below give Claude a complete inventory and the rules for extending it." }
    ],
    rules: [
      { rule: "Template first",           detail: "Always copy from ./template/ via /build; never scaffold by hand." },
      { rule: "Guides are sequential",    detail: "01-08 backend, 01-12 frontend: load them in order." },
      { rule: "Standards are cross-cutting", detail: "Re-check standards after each feature, not just at start." },
      { rule: "Hard-block on missing prior deliverables", detail: "A phase refuses to proceed if its required upstream artifact is missing: print an error and exit non-zero." },
      { rule: "Maintain documentation",   detail: "Run /sync-docs after every feature; CI runs the same on every push." },
      { rule: "Security scans are mandatory", detail: "AI analysis alone is insufficient: run the deterministic blueteam + redteam + greenteam + yellowteam scripts." },
      { rule: "Parameterized SQL only. httpOnly cookies only.", detail: "No exceptions." },
      { rule: "Migrations are idempotent, tracked, auto-run", detail: "NNN_*.sql files only. Every statement uses IF NOT EXISTS / ON CONFLICT. Runner fires on every build AND every release." },
      { rule: "No silent deferrals", detail: "Must-have FR/NFR cannot be marked complete without code evidence. Scope cuts require formal downgrade in requirements.md + re-plan via /phase2-planning. check-fr-coverage.mjs + check-nfr-coverage.mjs + check-no-silent-deferral.mjs mechanically block advancing if any must-have lacks code OR any 'deferred' phrase in a phase report lacks a paper trail." },
      { rule: "All gates mechanical, not aspirational", detail: "Every 'must do X' has a script that exits non-zero if X didn't happen. check-step-gates.mjs runs before each phase advance; failures block the move. Evals are the harness's truth-telling layer: see #evals for the full matrix and the philosophy that gaps mean better evals, not just retries." },
      { rule: "Nav completeness: no orphan pages", detail: "Every public-facing FR must be reachable from / via visible nav links in ≤2 clicks. check-nav-completeness.mjs parses the router + layout components + landing page; any FR-cited public route not in nav fails the gate. phase3-architecture's IA section (check-ia-section.mjs) is the upstream half: sitemap defined first, wiring verified after." },
      { rule: "Blueteam pipeline is all-or-nothing", detail: "/phase5-development and /phase8-deployment must complete the full security pipeline: scan + HTML overview + risk-acceptance file + validate_reports.js. check-blueteam-pipeline.mjs blocks if any stage is missing. Findings without explicit RA-NNN entries count as unaddressed." },
      { rule: "Evidence strength beats config presence", detail: "An NFR is not 'covered' because lighthouserc.json or vue-i18n exists. check-evidence-strength.mjs verifies actual exercise: a Lighthouse run output, locale files PLUS $t() call sites, axe invocation, logger call sites. Config without measurement is not evidence." }
    ]
  },

  phaseSkills: [
    { n: 1, id: "phase1-requirements", slash: "/phase1-requirements", phase: "discovery",
      purpose: "Read project briefs, RFPs, and user stories from the local inputs directory, classify them, extract stakeholders/objectives/constraints, and produce a structured requirements document with FRs (MoSCoW), NFRs, and module decomposition.",
      inputs: ["./phases/phase1-requirements/inputs/ (briefs, RFPs, transcripts, user stories)"],
      requires: [],

      methodology: ".claude/skills/phase1-requirements/methodology.md",
      template: ".claude/skills/phase1-requirements/output-template.md" },
    { n: 2, id: "phase2-planning", slash: "/phase2-planning", phase: "discovery",
      purpose: "Decompose requirements into 0.5-3d tasks; classify owner profile (ai/human/paired); wire dependencies; group into milestones; identify the critical path; map every NFR to at least one task.",
      inputs: ["./phases/phase1-requirements/output/requirements.md"],

      output: "plan.md", outputPath: "phases/phase2-planning/output/plan.md",

      inputs: ["./phases/phase1-requirements/output/requirements.md", "./phases/phase2-planning/output/plan.md"],
      requires: ["phase1-requirements", "phase2-planning"],
      output: "architecture.md + ADRs", outputPath: "phases/phase3-architecture/output/",
      methodology: ".claude/skills/phase3-architecture/methodology.md",
      template: ".claude/skills/phase3-architecture/output-template.md" },
    { n: 4, id: "phase4-prototyping", slash: "/phase4-prototyping", phase: "build",
      purpose: "Build the riskiest end-to-end slice (the tracer bullet) to validate the architecture's headline assumptions before committing the whole plan to them. Document validations, falsifications, performance baseline, mock inventory, and proposed architecture revisions.",
      inputs: ["./phases/phase3-architecture/output/architecture.md (riskiest path identified in §6 Handoff)", "ADR files"],
      requires: ["phase3-architecture"],
      output: "prototype-report.md + working slice in repo",
      outputPath: "phases/phase4-prototyping/output/",
      methodology: ".claude/skills/phase4-prototyping/methodology.md",
      template: ".claude/skills/phase4-prototyping/output-template.md" },
    { n: 5, id: "phase5-development", slash: "/phase5-development", phase: "build",
      purpose: "Build production code. HARD-BLOCKS if ./app/ isn't scaffolded by /build first (template-first, never by hand). Executes plan milestones in order, follows guides 01-08, applies all standards continuously, runs /sync-docs after every feature, runs /blueteam before declaring done. Tests + a11y + performance gates are part of complete.",
      inputs: ["./phases/phase3-architecture/output/architecture.md", "./phases/phase2-planning/output/plan.md (milestones)", "./app/ scaffolded by /build", "./phases/phase4-prototyping/output/prototype-report.md (mock inventory)"],
      requires: ["phase3-architecture", "build"],
      output: "code in ./app/ + development-report.md",
      outputPath: "phases/phase5-development/output/",
      methodology: ".claude/skills/phase5-development/methodology.md",
      template: ".claude/skills/phase5-development/output-template.md" },
    { n: 6, id: "phase6-user-testing", slash: "/phase6-user-testing", phase: "verify",

      inputs: ["./app/ built + ./phases/phase1-requirements/output/requirements.md", "Phase B also: human session notes"],
      requires: ["phase5-development"],
      output: "Phase A: test-plan.md + manual scripts + automated suite (committed). Phase B: test-results.md",
      outputPath: "phases/phase6-user-testing/output/",
      methodology: ".claude/skills/phase6-user-testing/methodology.md",
      template: ".claude/skills/phase6-user-testing/output-template.md (+ output-template-results.md for Phase B)" },
    { n: 7, id: "phase7-user-acceptance", slash: "/phase7-user-acceptance", phase: "verify",
      purpose: "Two-phase stakeholder sign-off. Phase A generates uat-script.md (FR-by-FR pass/fail checklist + 30-60 min demo prep + deferral backlog + sign-off roster). Phase B captures stakeholder decisions into sign-off.md with explicit conditions becoming /phase8-deployment prerequisites.",
      inputs: ["./phases/phase6-user-testing/output/test-results.md (no Criticals, no send-back decision)", "Phase B also: stakeholder UAT outcomes"],
      requires: ["phase6-user-testing"],
      output: "Phase A: uat-script.md. Phase B: sign-off.md",
      outputPath: "phases/phase7-user-acceptance/output/",
      methodology: ".claude/skills/phase7-user-acceptance/methodology.md",
      template: ".claude/skills/phase7-user-acceptance/output-template.md (+ output-template-signoff.md for Phase B)" },
    { n: 8, id: "phase8-deployment", slash: "/phase8-deployment", phase: "ship",
      purpose: "Ship to production. Probes for Nexus (gcloud + GCP project): if available, deploys to GCP Cloud Run with migrations as a one-shot Cloud Run job. If not, builds local Docker image, runs migrations, launches locally, and prepares a handoff tarball for a human to push to real prod. Both paths run idempotent migrations as part of release (rule #8), execute the pre-deploy gate (sync-docs zero-drift, blueteam zero-criticals, idempotency proof, secret inventory, health probe), smoke-test, and document rollback.",
      inputs: ["./phases/phase7-user-acceptance/output/sign-off.md (all approvals, conditions satisfied)", "./app/ built + migrations/ tracked"],

      output: "runbook.md + release-notes.md + (cloud-run-state.json | handoff.tar.gz)",
      outputPath: "phases/phase8-deployment/output/",
      methodology: ".claude/skills/phase8-deployment/methodology.md",
      template: ".claude/skills/phase8-deployment/output-template.md (+ output-template-release.md for release notes)" }

  evaluations: [
    { id: "validate-step-output", name: "Output template structure",

      surfaces: "Missing required sections, missing required tables, missing required mermaid diagrams in any phase's .md output.",

      script: ".claude/scripts/check-external-deps.mjs",
      fires: ["phase1","phase2"],
      surfaces: "External dependencies that block must-have FRs but haven't been confirmed (a tenant that wasn't provisioned, an API key the sponsor forgot to issue, an account that was never allocated). Forces these to surface at /phase1-requirements instead of as a /phase5-development surprise.",
      flexibility: "Adjust the accepted Status values (the script already accepts `confirmed` and `confirmed-as-deferrable`). Add columns to the External Dependencies table for project-specific tracking (e.g., a Linear ticket ID column)." },
    { id: "check-fr-coverage", name: "FR coverage",
      script: ".claude/scripts/check-fr-coverage.mjs",
      fires: ["phase5","phase7","phase8"],
      surfaces: "Every must-have FR must have a code citation in app/. Doc-only mentions (the dev-report claiming 'complete') don't count.",
      flexibility: "Adjust the must-vs-should threshold per project. Weight heavier toward 'doc-only' for documentation-heavy work where prose IS the deliverable." },
    { id: "check-nfr-coverage", name: "NFR coverage",
      script: ".claude/scripts/check-nfr-coverage.mjs",
      fires: ["phase5","phase7","phase8"],
      surfaces: "NFRs without implementation evidence per category: PWA manifest, axe dep, structured logger, idempotent migrations, etc.",
      flexibility: "Per-category checks are tunable. Building a CLI tool? Skip NFR-PWA. Building a backend service? Skip nav-related. Mark a category 'manual-verify' to acknowledge process NFRs." },
    { id: "check-evidence-strength", name: "Evidence strength",
      script: ".claude/scripts/check-evidence-strength.mjs",
      fires: ["phase5","phase7","phase8"],
      surfaces: "Deps/configs that exist but aren't exercised: lighthouserc with no run, locales with no $t() calls, axe dep with no AxeBuilder invocation, logger imported but never called.",
      flexibility: "Add new categories per stack. SAST scan output? Performance benchmark CSV? Bundle-size report? The pattern is always: presence + actual call site." },
    { id: "check-nav-completeness", name: "Nav completeness",
      script: ".claude/scripts/check-nav-completeness.mjs",
      fires: ["phase5","phase6","phase7","phase8"],
      surfaces: "Public-facing routes in the router that have NO nav-link from /: orphan pages users cannot discover.",
      flexibility: "Skip for non-UI projects (CLI, backend service). For multi-portal apps, override via per-portal nav source files. The eval reads the router + layout + landing-page; swap any of those for project-specific equivalents." },
    { id: "check-test-presence", name: "Test presence + traceability",
      script: ".claude/scripts/check-test-presence.mjs",
      fires: ["phase5","phase6","phase8"],
      surfaces: "Empty test stubs, e2e specs that don't cite any FR-NNN ID, missing unit tests, test files with no expect/assert/it/test calls.",
      flexibility: "Adjust assertion regex per framework (Vitest, Jest, Playwright, Go testing). Add stack-specific signatures (e.g., Go's testing.T.Run pattern, Rust's #[test])." },
    { id: "check-blueteam-pipeline", name: "Blueteam pipeline complete",

    { id: "check-ia-section", name: "Information Architecture",
      script: ".claude/scripts/check-ia-section.mjs",
      fires: ["phase3"],
      surfaces: "phase3 architecture.md missing the IA section, sitemap, or nav-wiring table: root cause of orphan-page bugs at phase5.",
      flexibility: "Skip for non-UI projects. Tighten by requiring a mermaid sitemap diagram in addition to the table. Add an explicit click-depth column for accessibility-sensitive apps." },
    { id: "check-no-silent-deferral", name: "No silent deferrals",
      script: ".claude/scripts/check-no-silent-deferral.mjs",
      fires: ["phase5","phase6","phase7","phase8"],
      surfaces: "Phase reports use 'deferred' / 'follow-up' / 'post-launch' near must/should requirements without paper trail (replan, phase8 prereq, or RA entry).",
      flexibility: "Adjust the deferral-language regex per documentation style. Relax for research/spike projects where deferrals are inherent to the work: but accompany with explicit annotation." },
    { id: "check-migration-idempotency", name: "Migration idempotency",
      script: ".claude/scripts/check-migration-idempotency.mjs",
      fires: ["phase5","phase8"],
      surfaces: "Migrations whose second application changes schema state: empirically tested by spinning up a scratch Postgres in Docker and snapshotting before/after.",
      flexibility: "Skip for DB-less projects. Add per-engine variants (MySQL, SQLite, MongoDB) by parameterising the container image and snapshot query." },
    { id: "sync-docs", name: "Doc drift",

      flexibility: "Override the rules file for non-Express stacks. Add new artifact pairs (e.g., GraphQL schema ↔ resolver coverage)." }

  generalSkills: [

        </section>

        <!-- Extend -->
        <section id="extend" class="anchor-target">
          <h2 class="text-2xl font-semibold tracking-tight text-slate-900 mb-4">How to extend</h2>
          <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-white rounded-lg p-5 border border-slate-200">
              <div class="font-semibold text-slate-900 mb-2">Naming</div>
              <ul class="text-sm text-slate-700 space-y-1">
                <li>· <strong>Phase skill:</strong> {{ data.extending.phaseStep }}</li>
                <li>· <strong>General skill:</strong> {{ data.extending.generalSkill }}</li>
              </ul>
            </div>
            <div class="bg-white rounded-lg p-5 border border-slate-200">
              <div class="font-semibold text-slate-900 mb-2">Files inside <code class="text-xs">.claude/skills/&lt;name&gt;/</code></div>
              <ul class="text-sm text-slate-700 space-y-1">
                <li v-for="f in data.extending.files" :key="f">· <code class="text-xs">{{ f }}</code></li>
              </ul>
            </div>
            <div class="bg-white rounded-lg p-5 border border-slate-200 md:col-span-2">
              <div class="font-semibold text-slate-900 mb-2">After creating the skill</div>
              <ol class="text-sm text-slate-700 space-y-1 list-decimal list-inside">
                <li v-for="step in data.extending.afterCreate" :key="step">{{ step }}</li>
              </ol>
            </div>
          </div>
        </section>

      </main>

      <footer class="border-t border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto px-6 py-8 text-sm text-slate-500 flex flex-wrap gap-4 justify-between">
          <div>Claude Build Harness · CC0 1.0 · Open source</div>
          <div>Driven by <code class="text-xs">harnessData</code> in this file. To extend, edit the JSON and refresh.</div>
        </div>
      </footer>
    </div>
  `,
  computed: {
    evalStepIds() { return ['phase1','phase2','phase3','phase4','phase5','phase6','phase7','phase8']; }
  },
  methods: {
    stepX(i) { return 35 + i * 145; },
    phaseStroke(p) { return ({discovery:'#2563eb', build:'#059669', verify:'#d97706', ship:'#7c3aed'})[p] || '#475569'; },
    stepShortName(id) { return id.replace(/^phase\d+-/, '').replace(/-/g, ' '); },
    evalRowTransform(i) { return `translate(0, ${40 + i * 40})`; },
    evalShortPath(p) { return p.replace(/^\.claude\/(scripts|skills)\//, ''); },
    truncate(s, n) { return s.length > n ? s.slice(0, n - 1).trim() + '…' : s; },
    skillSourceFolder(s) {
      if (!s.methodology) return null;
      return s.methodology.split('/').slice(0, -1).join('/') + '/';
    },
    skillDestFolder(s) {
      if (!s.outputPath) return null;
      return s.outputPath.split('/').slice(0, -1).join('/') + '/';
    },
    exportMarkdown() {
      const d = harnessData;
      const date = new Date().toISOString().split('T')[0];
      let md = `# ${d.meta.title}\n\n> ${d.meta.tagline}\n\n${d.meta.description}\n\n---\n\n`;

      md += `## Who This Is For\n\n`;
      d.meta.audience.forEach(a => { md += `**${a.who}**: ${a.why}\n\n`; });

      md += `## Non-Negotiable Rules\n\n`;
      d.meta.rules.forEach((r, i) => { md += `${i + 1}. **${r.rule}**: ${r.detail}\n`; });
      md += '\n';

      md += `## The 8-Phase Build Lifecycle\n\n`;
      md += `| Phase | Slash | Group | Output | Requires |\n|---|---|---|---|---|\n`;
      d.phaseSkills.forEach(s => {
        md += `| phase${s.n} | \`${s.slash}\` | ${s.phase} | \`${s.output}\` | ${s.requires.join(', ') || '-'} |\n`;
      });
      md += '\n';

      md += `## Phase Skill Detail\n\n`;
      d.phaseSkills.forEach(s => {
        const srcFolder = s.methodology ? s.methodology.split('/').slice(0, -1).join('/') + '/' : null;
        const dstFolder = s.outputPath  ? s.outputPath.split('/').slice(0, -1).join('/') + '/'  : null;
        md += `### phase${s.n}: \`${s.slash}\` (${s.phase})\n\n${s.purpose}\n\n`;
        md += `- **Inputs:** ${s.inputs.join('; ')}\n`;
        md += `- **Output:** \`${s.output}\`\n`;
        if (dstFolder) md += `- **Destination folder:** \`${dstFolder}\`\n`;
        if (srcFolder) md += `- **Source folder:** \`${srcFolder}\`\n`;
        if (s.requires.length) md += `- **Requires:** ${s.requires.map(r => '/' + r).join(', ')}\n`;
        md += '\n';
      });

      md += `## Evaluations\n\n`;
      md += `| Eval | Script | Fires at | Surfaces |\n|---|---|---|---|\n`;
      d.evaluations.forEach(e => {
        md += `| **${e.name}** | \`${e.script.replace(/^\.claude\/(scripts|skills)\//, '')}\` | ${e.fires.join(', ')} | ${e.surfaces} |\n`;
      });
      md += '\n';

      md += `## General Skills\n\n`;
      d.generalSkills.forEach(s => {
        md += `### \`${s.slash}\`\n\n${s.purpose}\n\n**When:** ${s.use}\n\n`;
        if (s.args) { md += `**Usage:**\n`; s.args.forEach(a => { md += `- \`${s.slash} ${a}\`\n`; }); md += '\n'; }
      });

      md += `## Standards\n\n> Located at \`.claude/standards/\`\n\n`;
      md += `| Standard | File | Scope |\n|---|---|---|\n`;
      d.standards.forEach(s => { md += `| **${s.name}** | \`.claude/standards/${s.id}.md\` | ${s.scope} |\n`; });
      md += '\n';

      md += `## Guides\n\n> Located at \`.claude/guides/\`\n\n`;
      d.guides.forEach(g => { md += `### ${g.area}: \`${g.path}\` (${g.count} guides)\n\n${g.summary}\n\n`; });

      md += `## Reference Docs\n\n> Located at \`.claude/references/\`\n\n`;
      d.references.forEach(r => { md += `### ${r.name}: \`.claude/references/${r.id}.md\`\n\n${r.purpose}\n\n**Loaded by:** ${r.loadedBy}\n\n`; });

      md += `## Templates\n\n`;
      md += `| Path | Stack | Use when |\n|---|---|---|\n`;
      d.templates.forEach(t => { md += `| \`${t.path}\` | ${t.stack} | ${t.use} |\n`; });
      md += '\n';

      md += `## Workspace\n\n`;
      md += `| Path | Purpose |\n|---|---|\n`;
      d.workspace.forEach(w => { md += `| \`${w.path}\` | ${w.note} |\n`; });
      md += '\n';

      md += `## How to Extend\n\n`;
      md += `**Phase skill naming:** ${d.extending.phaseStep}\n\n`;
      md += `**General skill naming:** ${d.extending.generalSkill}\n\n`;
      md += `**Required files in \`.claude/skills/<name>/\`:**\n\n`;
      d.extending.files.forEach(f => { md += `- \`${f}\`\n`; });
      md += '\n';
      md += `**After creating the skill:**\n\n`;
      d.extending.afterCreate.forEach((step, i) => { md += `${i + 1}. ${step}\n`; });
      md += '\n';

      md += `---\n\n*Generated from Claude Build Harness · ${date} · CC0 1.0 · Open source*\n`;

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `claude-build-harness-${date}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }
};

createApp(App).mount('#app');
</script>

</body>
</html>
